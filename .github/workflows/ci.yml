name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql+psycopg://docmind:docmind@localhost:5432/docmind
      GEMINI_API_KEY: offline-test-key
      JWT_SECRET_KEY: offline-test-secret-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check app tests evaluation
      - run: python -m pytest tests -v

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  container-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag docmind-api:ci .
      - run: docker build --tag docmind-frontend:ci ./frontend
