
x-api-environment: &api-env
  DATABASE_URL: ${DATABASE_URL:?Required}
  GEMINI_API_KEY: ${GEMINI_API_KEY:?Required}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
  GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:?Required}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Required}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  TRUST_PROXY_HEADERS: "true"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: docmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    mem_limit: 1100m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    image: docmind-api:prod
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    restart: "no"

  api:
    image: docmind-api:prod
    environment: *api-env
    networks:
      - app
      - data
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 1200m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: docmind-frontend:prod
    networks:
      - edge
      - app
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - frontend
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped

networks:
  edge:
    driver: bridge

  app:
    driver: bridge
    internal: true

  data:
    driver: bridge
    internal: true

  egress:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
